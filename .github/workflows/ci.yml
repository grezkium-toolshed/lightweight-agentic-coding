name: CI

on:
  push:
  pull_request:

jobs:
  validate-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Offline contract check
        run: ./scripts/verify.sh

      - name: Integration test (CLI workflow, no GPU)
        run: ./scripts/integration-test.sh
