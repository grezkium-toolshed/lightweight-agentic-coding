name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Offline contract check
        run: ./scripts/verify.sh

      - name: Integration test (CLI workflow, no GPU)
        run: ./scripts/integration-test.sh

  package:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build frontend
        run: python -m pip install build

      - name: Build, inspect, and smoke-test published artifacts
        run: ./scripts/verify-package-build.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: PowerShell wrapper and client-render smoke test
        shell: pwsh
        run: |
          $env:LAC_STATE_ROOT = Join-Path $env:RUNNER_TEMP "lac-state"
          ./scripts/stage-data.ps1
          ./bin/lac.ps1 --version
          ./bin/lac.ps1 profile apply micro --json
          ./bin/lac.ps1 client render claude-code --json
