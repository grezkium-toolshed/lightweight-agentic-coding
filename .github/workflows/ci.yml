name: Manual compatibility checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Offline contract check
        run: ./scripts/verify.sh

      - name: Integration test (CLI workflow, no GPU)
        run: ./scripts/integration-test.sh

  package:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build frontend
        run: python -m pip install build

      - name: Build, inspect, and smoke-test published artifacts
        run: ./scripts/verify-package-build.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $Failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $Tokens = $null
            $Errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$Tokens, [ref]$Errors
            ) | Out-Null
            if ($Errors.Count -gt 0) {
              $Failed = $true
              Write-Error "$($_.FullName): $($Errors -join '; ')"
            }
          }
          if ($Failed) { throw "PowerShell parse errors found" }

      - name: PowerShell wrapper and client-render smoke test
        shell: pwsh
        run: |
          $env:LAC_STATE_ROOT = Join-Path $env:RUNNER_TEMP "lac-state"
          ./scripts/stage-data.ps1
          python -m unittest discover -s tests -p "test_*.py"
          ./bin/lac.ps1 --version
          ./bin/lac.ps1 profile apply micro --json
          ./bin/lac.ps1 profile apply 48gb --json
          ./bin/lac.ps1 client render claude-code --json

      - name: Build and smoke-test installed Windows wheel
        shell: pwsh
        run: |
          python -m pip install build
          python -m build
          $Wheel = (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
          $Venv = Join-Path $env:RUNNER_TEMP "lac-wheel"
          python -m venv $Venv
          $Python = Join-Path $Venv "Scripts/python.exe"
          $Lac = Join-Path $Venv "Scripts/lac.exe"
          & $Python -m pip install $Wheel
          & $Lac --version
          Push-Location $env:RUNNER_TEMP
          try {
            $Summary = (& $Lac profile apply micro --json | ConvertFrom-Json)
          } finally {
            Pop-Location
          }
          $ExpectedRoot = Join-Path $env:LOCALAPPDATA "lac"
          if (-not $Summary.state_root.StartsWith($ExpectedRoot, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "Installed wheel did not use LOCALAPPDATA: $($Summary.state_root)"
          }
