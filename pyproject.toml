[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lightweight-agentic-coding"
dynamic = ["version"]
description = "Private, on-device AI setup and orchestration for everyday work and coding."
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "Lightweight Agentic Coding contributors" }
]
keywords = [
  "agentic-coding",
  "private-ai",
  "llama.cpp",
  "opencode",
  "local-ai",
  "on-device-ai",
  "office-automation",
  "apple-silicon",
  "ds4"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Office/Business",
  "Topic :: System :: Systems Administration"
]

[project.urls]
Homepage = "https://github.com/grezkium-toolshed/lightweight-agentic-coding"
Repository = "https://github.com/grezkium-toolshed/lightweight-agentic-coding"
Issues = "https://github.com/grezkium-toolshed/lightweight-agentic-coding/issues"
Changelog = "https://github.com/grezkium-toolshed/lightweight-agentic-coding/blob/main/CHANGELOG.md"
Documentation = "https://github.com/grezkium-toolshed/lightweight-agentic-coding/tree/main/docs"

[project.scripts]
lac = "lac.cli:main"

[tool.setuptools.dynamic]
version = { attr = "lac.VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lac" = ["data/*", "data/**/*", "data/**/**/*", "data/**/**/**/*", "data/**/**/**/**/*"]
