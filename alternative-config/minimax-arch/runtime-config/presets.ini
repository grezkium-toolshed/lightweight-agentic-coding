# Archived reference preset for MiniMax experiments.
# Active path in vNext: root profile scripts with --profile 128gb-minimax.

version = 1

[*]
flash-attn = true
parallel = 1

[minimax-m2.5]
model = __MODELS_DIR__/minimax/MiniMax-M2.5-UD-Q3_K_XL-00001-of-00004.gguf
ctx-size = 65536
n-gpu-layers = 999
threads = 12
batch-size = 384
ubatch-size = 96
temp = 0.6
top-p = 0.9
top-k = 32
min-p = 0.0
jinja = true
chat-template-file = __CLUSTER_ROOT__/runtime-config/chat-templates/qwen3.5.jinja
