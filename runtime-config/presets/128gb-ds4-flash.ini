; Profile: 128gb-ds4-flash
; Source template for DwarfStar ds4 runtime selection.
; Rendered to: state/runtime/presets.active.ini for profile bookkeeping.
;
; ds4 does not use llama.cpp --models-preset files. The actual launch command is
; assembled by lac runtime start:
;   ds4-server -m <model> --ctx 100000 --kv-disk-dir state/runtime/ds4-kv
;
; Local overrides:
;   DS4_BIN=/path/to/ds4-server
;   DS4_MODEL=/path/to/ds4flash.gguf
;   DS4_PORT=8000
;   DS4_CTX=100000
;   DS4_KV_DISK_SPACE_MB=8192

version = 1

[*]
host = 127.0.0.1
port = 8000

[qwen3.5-4b-q4]
model = __MODELS_DIR__/qwen3.5/Qwen3.5-4B-Q4_K_M.gguf
ctx-size = 32768
fit = true
fit-ctx = 32768
n-gpu-layers = 99
threads = 4
batch-size = 256
ubatch-size = 64
cache-type-k = q8_0
cache-type-v = q8_0
temp = 0.7
top-p = 0.8
top-k = 20
min-p = 0.0
presence-penalty = 1.5
repeat-penalty = 1.0
jinja = true
chat-template-file = __CLUSTER_ROOT__/runtime-config/chat-templates/qwen3.5.jinja
reasoning = off
