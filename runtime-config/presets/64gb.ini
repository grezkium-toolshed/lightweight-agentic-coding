; Profile: 64gb
; Source template for llama-server runtime settings.
; Rendered to: state/runtime/presets.active.ini
; 
; Key settings in this preset:
;   - Default model: qwen3.6-35b-a3b-q8
;   - Context size: 262144
;   - Port: 8080 (llama.cpp default)
;   - GPU layers: n-gpu-layers = 999 means offload all layers
;   - MTP models use spec-type = draft-mtp for 1.4-2.2x faster inference
;
; When to edit this file:
;   - You want to change defaults for EVERY user of this profile.
;   - You are adjusting sampling parameters (temp, top-p, penalties).
;   - You are adding a new model slot to the profile.
;
; When NOT to edit this file:
;   - You want to tweak settings for your local machine only.
;     In that case, edit state/runtime/presets.active.ini after running
;     ./bin/lac profile apply <profile>, but note that re-running apply
;     will overwrite your changes.
;
; Regenerate the active preset:
;   ./bin/lac profile apply 64gb
;

version = 1

