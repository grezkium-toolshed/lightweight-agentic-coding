; Profile: 128gb-minimax
; Source template for llama-server runtime settings.
; Rendered to: state/runtime/presets.active.ini
; 
; Key settings in this preset:
;   - Default model: minimax-m2.7
;   - Context size: 65536
;   - Port: 8080 (llama.cpp default)
;   - GPU layers: n-gpu-layers = 999 means offload all layers
;   - MTP models use spec-type = draft-mtp for 1.4-2.2x faster inference
;
; When to edit this file:
;   - You want to change defaults for EVERY user of this profile.
;   - You are adjusting sampling parameters (temp, top-p, penalties).
;   - You are adding a new model slot to the profile.
;
; When NOT to edit this file:
;   - You want to tweak settings for your local machine only.
;     In that case, edit state/runtime/presets.active.ini after running
;     ./bin/lac profile apply <profile>, but note that re-running apply
;     will overwrite your changes.
;
; Regenerate the active preset:
;   ./bin/lac profile apply 128gb-minimax
;

version = 1

[*]
host = 127.0.0.1
port = 8080
flash-attn = true
parallel = 1
jinja = true
load-on-startup = minimax-m2.7

[minimax-m2.7]
model = __MODELS_DIR__/minimax/MiniMax-M2.7-UD-IQ4_XS-00001-of-00003.gguf
ctx-size = 65536
fit = true
fit-ctx = 65536
n-gpu-layers = 999
threads = 12
batch-size = 384
ubatch-size = 96
cache-type-k = q8_0
cache-type-v = q8_0
temp = 0.6
top-p = 0.9
top-k = 32
min-p = 0.0
presence-penalty = 0.1
repeat-penalty = 1.02
jinja = true
chat-template-file = __CLUSTER_ROOT__/runtime-config/chat-templates/qwen3.5.jinja
reasoning = off

[qwen3.6-27b-mtp-q4]
model = __MODELS_DIR__/qwen3.6-mtp/Qwen3.6-27B-MTP-UD-Q4_K_XL.gguf
ctx-size = 262144
fit = true
fit-ctx = 262144
n-gpu-layers = 999
threads = 10
batch-size = 1024
ubatch-size = 256
cache-type-k = q8_0
cache-type-v = q8_0
temp = 0.7
top-p = 0.9
top-k = 40
min-p = 0.0
presence-penalty = 0.2
repeat-penalty = 1.04
jinja = true
chat-template-file = __CLUSTER_ROOT__/runtime-config/chat-templates/qwen3.5.jinja
reasoning = off
spec-type = draft-mtp
spec-draft-n-max = 6

[qwen3.6-35b-a3b-mtp-q6]
model = __MODELS_DIR__/qwen3.6-mtp/Qwen3.6-35B-A3B-MTP-UD-Q6_K_XL.gguf
ctx-size = 262144
fit = true
fit-ctx = 262144
n-gpu-layers = 999
threads = 12
batch-size = 1536
ubatch-size = 384
cache-type-k = q8_0
cache-type-v = q8_0
temp = 0.7
top-p = 0.92
top-k = 40
min-p = 0.0
presence-penalty = 0.4
repeat-penalty = 1.04
jinja = true
chat-template-file = __CLUSTER_ROOT__/runtime-config/chat-templates/qwen3.5.jinja
reasoning = off
spec-type = draft-mtp
spec-draft-n-max = 6

[nomic-embed-text-v1.5]
model = __MODELS_DIR__/embeddings/nomic-embed-text-v1.5.Q4_K_M.gguf
ctx-size = 2048
n-gpu-layers = 99
threads = 4
batch-size = 256
ubatch-size = 64
temp = 0.0
reasoning = off
