; Profile: macos-16gb
; Source template for llama-server runtime settings.
; Rendered to: state/runtime/presets.active.ini
; 
; Key settings in this preset:
;   - Default model: gemma-4-12b-qat (Google-official QAT, near-lossless)
;   - Context size: 32768 (262144 for 12B slot)
;   - Port: 8080 (llama.cpp default)
;   - GPU layers: n-gpu-layers = 999 means offload all layers
;   - 12B is encoder-free (text+image+audio), the strongest reasoning model in this profile
;
; When to edit this file:
;   - You want to change defaults for EVERY user of this profile.
;   - You are adjusting sampling parameters (temp, top-p, penalties).
;   - You are adding a new model slot to the profile.
;
; When NOT to edit this file:
;   - You want to tweak settings for your local machine only.
;     In that case, edit state/runtime/presets.active.ini after running
;     ./bin/lac profile apply <profile>, but note that re-running apply
;     will overwrite your changes.
;
; Regenerate the active preset:
;   ./bin/lac profile apply macos-16gb
;

version = 1

[*]
host = 127.0.0.1
port = 8080
flash-attn = true
parallel = 1
jinja = true
load-on-startup = gemma-4-12b-qat

[gemma-4-12b-q4]
model = __MODELS_DIR__/gemma4/gemma-4-12b-it-UD-Q4_K_XL.gguf
ctx-size = 262144
fit = true
fit-ctx = 262144
n-gpu-layers = 999
threads = 8
batch-size = 1024
ubatch-size = 256
cache-type-k = q8_0
cache-type-v = q8_0
temp = 1.0
top-p = 0.95
top-k = 64
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0
jinja = true
chat-template-file = __CLUSTER_ROOT__/runtime-config/chat-templates/gemma-4.jinja
reasoning = off

; Ornith ships its own embedded chat template (custom Qwen-style); jinja = true
; with no chat-template-file override uses it. Sampling per the model card.
[ornith1.5-9b-q4]
model = __MODELS_DIR__/ornith1.5/Ornith-1.5-9B-Q4_K_M.gguf
ctx-size = 32768
fit = true
fit-ctx = 32768
n-gpu-layers = 99
threads = 8
batch-size = 512
ubatch-size = 128
cache-type-k = q8_0
cache-type-v = q8_0
mmproj = __MODELS_DIR__/ornith1.5/mmproj-Ornith-1.5-9B-BF16.gguf
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0
jinja = true
reasoning = off

